<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Wikipedia Link Cleaner">
  <title>Wikipedia Link Cleaner</title>
  <defs>
    <linearGradient id="wlc-bg-sm" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#46579E"/>
      <stop offset="1" stop-color="#1C2340"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="29" fill="url(#wlc-bg-sm)"/>

  <!-- 16/32 piksel için sadeleştirilmiş sürüm: alt çizgi bu ölçekte lekeye
       sıkıştırdığı için düşürüldü, W buna karşılık büyütüldü. -->
  <polyline points="18,34 42,95 64,54 86,95 110,34" fill="none" stroke="#FFFFFF"
            stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
